name: Validate Edunime scripts
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check resource script syntax
        run: node --check resources.js
      - name: Check existing site scripts
        run: |
          node --check script.js
          node --check features.js
